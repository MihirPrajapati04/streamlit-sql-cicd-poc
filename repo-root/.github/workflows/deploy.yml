name: Deploy Streamlit Apps to Snowflake (SQL)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'           # only trigger when app code changes

  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      apps:
        description: 'Space-separated app folder names to deploy (leave blank for all)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

jobs:
  detect-changed-apps:
    runs-on: ubuntu-latest
    outputs:
      changed_apps: ${{ steps.detect.outputs.changed_apps }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # need previous commit to diff

      - name: Detect changed app folders
        id: detect
        run: |
          # On manual trigger with specific apps, use those
          if [ -n "${{ github.event.inputs.apps }}" ]; then
            echo "changed_apps=${{ github.event.inputs.apps }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise, find which apps/ subdirs changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ')

          echo "Changed apps: $CHANGED"
          echo "changed_apps=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changed-apps
    if: needs.detect-changed-apps.outputs.changed_apps != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy changed Streamlit apps via SQL
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          APPS="${{ needs.detect-changed-apps.outputs.changed_apps }}"

          if [ -z "$APPS" ]; then
            echo "Deploying ALL apps..."
            python scripts/deploy.py
          else
            echo "Deploying apps: $APPS"
            python scripts/deploy.py $APPS
          fi