name: Check UAT Merge

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  check-uat-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch UAT
        run: git fetch origin uat

      - name: Log branches and commits
        run: |
          echo "Remote branches (sample):"
          git branch -r | head -40

          echo "Latest commit on origin/uat:"
          git log origin/uat -1 --oneline

          echo "PR branch tip (${{ github.head_ref }}):"
          git log -1 --oneline HEAD

          echo "Commits on PR tip not reachable from UAT (should be empty to pass):"
          git log --oneline origin/uat..HEAD || true

      - name: Verify all PR commits exist in UAT
        run: |
          PR_TIP="${{ github.event.pull_request.head.sha }}"
          echo "Checking commits reachable from $PR_TIP that are not in origin/uat..."

          MISSING=$(git rev-list "$PR_TIP" --not origin/uat)
          if [ -n "$MISSING" ]; then
            echo "Some commits on this PR branch are not in UAT. Merge the feature branch into UAT first."
            echo "Commits not in UAT history:"
            git log --oneline "$PR_TIP" --not origin/uat | head -50
            exit 1
          fi

          echo "All commits from the PR branch are contained in UAT history."
