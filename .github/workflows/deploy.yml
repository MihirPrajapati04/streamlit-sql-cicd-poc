name: Deploy Streamlit Apps to Snowflake (SQL)

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated app folder names to deploy (leave blank for all)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy Streamlit apps via SQL
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          APPS="${{ github.event.inputs.apps }}"

          if [ -z "$APPS" ]; then
            echo "Deploying ALL apps..."
            python scripts/deploy.py
          else
            echo "Deploying apps: $APPS"
            python scripts/deploy.py $APPS
          fi