name: Deploy Streamlit Apps to Snowflake (SQL)

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated app folder names to deploy (leave blank for all)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps_to_deploy: ${{ steps.detect.outputs.apps_to_deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed apps
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.apps }}" ]; then
            echo "Manual trigger — deploying: ${{ github.event.inputs.apps }}"
            echo "apps_to_deploy=${{ github.event.inputs.apps }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ' \
            | xargs)

          if [ -z "$CHANGED" ]; then
            echo "No app changes detected — skipping deploy."
          else
            echo "Changed apps detected: $CHANGED"
          fi

          echo "apps_to_deploy=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.apps_to_deploy != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy changed apps via SQL
        env:
          SNOWFLAKE_ACCOUNT:    ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:       ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:   ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:       ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE:  ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          APPS="${{ needs.detect.outputs.apps_to_deploy }}"
          echo "Deploying: $APPS"
          python scripts/deploy.py $APPS