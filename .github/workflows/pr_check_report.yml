name: Deploy Report

on:
  pull_request:
    branches:
      - uat
      - master

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report apps and target environment
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ' \
            | xargs)

          TARGET="${{ github.base_ref }}"

          if [ "$TARGET" = "uat" ]; then
            ENV_LABEL="DEV (preview) → UAT (on merge)"
          elif [ "$TARGET" = "main" ]; then
            ENV_LABEL="PROD (on tag after merge)"
          fi

          if [ -z "$CHANGED" ]; then
            echo "ℹ No app changes detected in this PR"
          else
            echo "🚀 Apps changed: $CHANGED"
            echo "🎯 Target: $ENV_LABEL"
          fi