name: Deploy to DEV

on:
  pull_request:
    branches:
      - uat

  workflow_dispatch:
    inputs:
      apps:
        description: 'App folder names to deploy (blank = all)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps_to_deploy: ${{ steps.detect.outputs.apps_to_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed apps
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.apps }}" ]; then
            echo "apps_to_deploy=${{ github.event.inputs.apps }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ' \
            | xargs)
          echo "apps_to_deploy=$CHANGED" >> $GITHUB_OUTPUT

  deploy-dev:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.apps_to_deploy != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy to DEV
        env:
          SNOWFLAKE_ENV:       dev
          SNOWFLAKE_ENV_ID:    DEV
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          APPS="${{ needs.detect.outputs.apps_to_deploy }}"
          echo "Deploying to DEV: $APPS"
          python scripts/deploy.py $APPS