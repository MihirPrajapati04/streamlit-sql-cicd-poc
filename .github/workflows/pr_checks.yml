name: PR Checks

on:
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 snowflake-connector-python

      # ── Check 1: Python syntax ──────────────────────────────
      - name: Python syntax check
        run: |
          find apps/ -name "*.py" -exec python -m py_compile {} \;
          echo "✓ All Python files are syntactically valid"

      # ── Check 2: Lint with flake8 ───────────────────────────
      - name: Lint with flake8
        run: |
          flake8 apps/ scripts/ \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --statistics
        continue-on-error: true

      # ── Check 3: Validate app structure + Snowflake checks ──
      - name: Validate app config and Snowflake infrastructure
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: python scripts/validate_apps.py

      # ── Check 4: Report which apps will deploy on merge ─────
      - name: Report apps that will deploy on merge
        run: |
          CHANGED=$(git diff --name-only origin/master HEAD \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ' \
            | xargs)

          if [ -z "$CHANGED" ]; then
            echo "ℹ No app changes detected in this PR"
          else
            echo "🚀 Apps that will deploy on merge: $CHANGED"
          fi