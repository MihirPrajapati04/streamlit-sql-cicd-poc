name: Deploy to PROD

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      apps:
        description: 'App folder names to deploy (blank = all)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to validate (required, ex: v1.2.3)'
        required: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apps_to_deploy: ${{ steps.detect.outputs.apps_to_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect changed apps from PR
        id: detect
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep '^apps/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ' ' \
            | xargs)
          if [ -z "$CHANGED" ]; then
            echo "No changed app folders detected under apps/."
            exit 1
          fi
          echo "apps_to_deploy=$CHANGED" >> "$GITHUB_OUTPUT"

  deploy-prod-pr:
    if: github.event_name == 'pull_request'
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy to PROD (PR)
        env:
          SNOWFLAKE_ENV:       prod
          SNOWFLAKE_ENV_ID:    PROD
          SNOWFLAKE_DB:        PROD_STREAMLIT_APP
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          APPS="${{ needs.detect.outputs.apps_to_deploy }}"
          echo "Deploying apps to PROD from PR: $APPS"
          python scripts/deploy.py $APPS

  deploy-prod-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag input
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release_tag must match v<major>.<minor>.<patch>."
            exit 1
          fi
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' not found."
            exit 1
          fi
          echo "Validated release tag: $RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy to PROD (manual)
        env:
          SNOWFLAKE_ENV:       prod
          SNOWFLAKE_ENV_ID:    PROD
          SNOWFLAKE_DB:        PROD_STREAMLIT_APP
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          APPS="${{ github.event.inputs.apps }}"
          if [ -z "$APPS" ]; then
            echo "Deploying ALL apps to PROD (manual)"
            echo "Release tag: ${{ github.event.inputs.release_tag }}"
            python scripts/deploy.py
          else
            echo "Deploying apps to PROD (manual): $APPS"
            echo "Release tag: ${{ github.event.inputs.release_tag }}"
            python scripts/deploy.py $APPS
          fi