name: Deploy to PROD

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      apps:
        description: 'App folder names to deploy (blank = all)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to validate (required, ex: v1.2.3)'
        required: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  verify-master-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure tag commit is on master
        run: |
          TAG_SHA="${{ github.sha }}"
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/master; then
            echo "Tag ${{ github.ref_name }} points to $TAG_SHA, which is not on origin/master."
            echo "Create release tags only from master commits."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is valid and on master."

  detect-prod-apps:
    if: github.event_name == 'push'
    needs: verify-master-tag
    runs-on: ubuntu-latest
    outputs:
      apps_to_deploy: ${{ steps.detect.outputs.apps_to_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Detect changed apps since previous release tag
        id: detect
        run: |
          TAG_SHA="${{ github.sha }}"
          PREV=$(git describe --tags --abbrev=0 --match='v*.*.*' "${TAG_SHA}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "No previous v*.*.* tag found; deploying all app folders under apps/."
            CHANGED=$(find apps -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec basename {} \; | sort -u | tr '\n' ' ' | xargs)
          else
            echo "Comparing $PREV..$TAG_SHA for changes under apps/"
            CHANGED=$(git diff --name-only "$PREV" "$TAG_SHA" \
              | grep '^apps/' \
              | awk -F'/' '{print $2}' \
              | sort -u \
              | tr '\n' ' ' \
              | xargs)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No app folder changes in this release; nothing to deploy to PROD."
            exit 1
          fi
          echo "apps_to_deploy=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Apps to deploy: $CHANGED"

  deploy-prod-tag:
    if: github.event_name == 'push'
    needs:
      - verify-master-tag
      - detect-prod-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy to PROD (tag)
        env:
          SNOWFLAKE_ENV:       prod
          SNOWFLAKE_ENV_ID:    PROD
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          echo "Deploying to PROD from tag: ${{ github.ref_name }}"
          APPS="${{ needs.detect-prod-apps.outputs.apps_to_deploy }}"
          echo "Deploying apps: $APPS"
          python scripts/deploy.py $APPS

  deploy-prod-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag input
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release_tag must match v<major>.<minor>.<patch>."
            exit 1
          fi
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' not found."
            exit 1
          fi
          echo "Validated release tag: $RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Deploy to PROD (manual)
        env:
          SNOWFLAKE_ENV:       prod
          SNOWFLAKE_ENV_ID:    PROD
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          APPS="${{ github.event.inputs.apps }}"
          if [ -z "$APPS" ]; then
            echo "Deploying ALL apps to PROD (manual)"
            echo "Release tag: ${{ github.event.inputs.release_tag }}"
            python scripts/deploy.py
          else
            echo "Deploying apps to PROD (manual): $APPS"
            echo "Release tag: ${{ github.event.inputs.release_tag }}"
            python scripts/deploy.py $APPS
          fi